# All defaults are shown. Omit any setting to keep its default.
[theme]
background = "default"
text = "default"
focus = "#00b4b4"
accent = "#00c8c8"
inactive = "#808080"
hints = "#c8c800"
error = "#ff6464"
error_border = "#c80000"

# Replace an action's keys as a list; duplicate keys are rejected.
[bindings.global]
quit = ["ctrl-q"]

[bindings.chats]
message_search = ["ctrl-f"]
unread = ["u"]
focus_next = ["tab"]
focus_previous = ["shift-tab"]
search = ["ctrl-p", "/"]
help = ["f1", "?"]
next = ["j", "down"]
previous = ["k", "up"]
open = ["enter"]

[bindings.messages]
message_actions = ["enter"]
copy_text = ["y"]
open_links = ["o"]
message_search = ["ctrl-f"]
focus_next = ["tab"]
focus_previous = ["shift-tab"]
search = ["ctrl-p", "/"]
help = ["f1", "?"]
next = ["j", "down"]
previous = ["k", "up"]
back = ["esc"]
reply = ["r"]
resend = ["R"]
page_up = ["pageup"]
page_down = ["pagedown"]
bottom = ["end"]

# Printable characters always remain text in the composer/search.
[bindings.composer]
message_search = ["ctrl-f"]
focus_next = ["tab"]
focus_previous = ["shift-tab"]
search = ["ctrl-p"]
help = ["f1"]
back = ["esc"]
send = ["enter"]
newline = ["alt-enter"]
remove_reply = ["alt-r"]

[bindings.search]
toggle_unread = ["ctrl-u"]
back = ["esc"]
open = ["enter"]
next = ["down"]
previous = ["up"]

[bindings.help]
back = ["esc"]

[bindings.resend]
back = ["esc"]
confirm = ["enter"]

[bindings.message_search]
back = ["esc"]
open = ["enter"]
next = ["down"]
previous = ["up"]

[bindings.message_actions]
back = ["esc"]
open = ["enter"]
next = ["down", "j"]
previous = ["up", "k"]
copy_text = ["y"]
open_links = ["o"]
reply = ["r"]
resend = ["R"]

[bindings.message_links]
back = ["esc"]
open = ["enter"]
next = ["down", "j"]
previous = ["up", "k"]
copy_text = ["y"]
