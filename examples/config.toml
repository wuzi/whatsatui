# All defaults are shown. Omit any setting to keep its default.
[ui]
mouse = true

# Silent desktop popups while the app is running (requires a desktop session).
[notifications]
enabled = true
previews = true # false hides contact/group names and message content

[theme]
background = "default"
text = "default"
focus = "#00b4b4"
accent = "#00c8c8"
own = "#6fdca3"
inactive = "#808080"
hints = "#c8c800"
error = "#ff6464"
error_border = "#c80000"

# Replace an action's keys as a list; duplicate keys are rejected.
[bindings.global]
quit = ["ctrl-q"]

[bindings.chats]
focus_composer = ["i"]
message_search = ["ctrl-f"]
unread = ["u"]
focus_next = ["tab"]
focus_previous = ["shift-tab"]
search = ["ctrl-p", "/"]
help = ["f1", "?"]
next = ["j", "down"]
previous = ["k", "up"]
open = ["enter"]

[bindings.messages]
focus_composer = ["i"]
play_audio = ["p", "space"]
audio_speed = ["s"]
audio_stop = ["x"]
react = ["a"]
reactions = ["I"]
edit_message = ["e"]
jump_to_quote = ["q"]
message_actions = ["enter"]
copy_text = ["y"]
open_links = ["o"]
download_media = ["d"]
open_media = ["v"]
message_search = ["ctrl-f"]
focus_next = ["tab"]
focus_previous = ["shift-tab"]
search = ["ctrl-p", "/"]
help = ["f1", "?"]
next = ["j", "down"]
previous = ["k", "up"]
back = ["esc"]
reply = ["r"]
resend = ["R"]
page_up = ["pageup"]
page_down = ["pagedown"]
scroll_up = ["K"]
scroll_down = ["J"]
bottom = ["end"]

# Printable characters always remain text in the composer/search.
[bindings.composer]
clear_text = ["ctrl-c"]
paste_clipboard = ["ctrl-v"]
stickers = ["ctrl-s"]
attach_image = ["ctrl-o"]
remove_attachment = ["alt-a"]
emoji = ["ctrl-e"]
message_search = ["ctrl-f"]
focus_next = ["tab"]
focus_previous = ["shift-tab"]
search = ["ctrl-p"]
help = ["f1"]
back = ["esc"]
send = ["enter"]
newline = ["shift-enter", "alt-enter"]
remove_reply = ["alt-r"]

[bindings.search]
toggle_unread = ["ctrl-u"]
back = ["esc"]
open = ["enter"]
next = ["down"]
previous = ["up"]

[bindings.help]
back = ["esc"]
next = ["down", "j"]
previous = ["up", "k"]
page_up = ["pageup"]
page_down = ["pagedown"]

[bindings.resend]
back = ["esc"]
confirm = ["enter"]

[bindings.message_search]
back = ["esc"]
open = ["enter"]
next = ["down"]
previous = ["up"]

[bindings.message_actions]
play_audio = ["p"]
react = ["a"]
reactions = ["I"]
edit_message = ["e"]
jump_to_quote = ["q"]
back = ["esc"]
open = ["enter"]
next = ["down", "j"]
previous = ["up", "k"]
copy_text = ["y"]
open_links = ["o"]
download_media = ["d"]
open_media = ["v"]
reply = ["r"]
resend = ["R"]

[bindings.message_links]
back = ["esc"]
open = ["enter"]
next = ["down", "j"]
previous = ["up", "k"]
copy_text = ["y"]

# Inline previews download visible images/stickers/GIFs in the background.
# GIF previews use ffmpeg and ffprobe from PATH.
[media]
avatars = true
inline = true
protocol = "auto" # auto, kitty, halfblocks; tmux/SSH use halfblocks

# Required only for received voice-message/audio playback.
[audio]
player = "mpv" # executable name or absolute path

[bindings.attachment]
open = ["enter"]
back = ["esc"]
next = ["down"]
previous = ["up"]

[bindings.emoji]
open = ["enter"]
back = ["esc"]
next = ["down"]
previous = ["up"]

[bindings.stickers]
paste_clipboard = ["ctrl-v"]
open = ["enter"]
back = ["esc"]
next = ["down", "j"]
previous = ["up", "k"]

[bindings.reactions]
open = ["enter"]
back = ["esc"]
react = ["a"]
remove_reaction = ["x"]
next = ["down", "j"]
previous = ["up", "k"]
