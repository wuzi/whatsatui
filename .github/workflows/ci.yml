name: Rust

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  check:
    name: Check and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config

      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Check formatting
        run: cargo +1.98.0 fmt --all -- --check

      - name: Clippy
        run: cargo +1.98.0 clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo +1.98.0 test --locked --all-targets

      - name: Remove build artifacts before release build
        run: cargo +1.98.0 clean

      - name: Build release
        if: runner.os == 'Linux'
        run: cargo +1.98.0 build --locked --release

      - name: Build Windows release
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo +1.98.0 build --locked --release --target x86_64-pc-windows-msvc

      - name: Smoke-test Windows executable
        if: runner.os == 'Windows'
        run: |
          ./target/x86_64-pc-windows-msvc/release/whatsapp-tui.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-tui-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/whatsapp-tui.exe
          if-no-files-found: error

      - name: Show disk usage
        if: always()
        shell: bash
        run: |
          df -h .
          du -sh target 2>/dev/null || true
