name: Rust

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config

      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Check formatting, Clippy and tests
        run: ./scripts/check.sh checks

      - name: Remove build artifacts before release build
        run: cargo +1.98.0 clean

      - name: Build release
        run: ./scripts/check.sh release

      - name: Show disk usage
        if: always()
        run: |
          df -h .
          du -sh target 2>/dev/null || true
