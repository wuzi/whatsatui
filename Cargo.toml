[package]
name = "whatsapp-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A personal WhatsApp terminal client with a cyan Ratatui interface"
license = "MIT"

[dependencies]
whatsapp-rust = { version = "=0.7.0", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "ureq-client", "tokio-native", "signal"] }
tokio = { version = "1", features = ["full", "test-util"] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
diesel = { version = "2.3", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
qrcode = { version = "0.14", default-features = false }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
futures-util = "0.3"
fs2 = "0.4"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
linkify = "0.11"
sha2 = "0.10.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ratatui-image = { version = "=11.1.0", default-features = false, features = ["crossterm"] }
emojis = "=0.9.0"
webp = { version = "=0.3.1", default-features = false }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
[target.'cfg(unix)'.dependencies]
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
arboard = "=3.6.1"
clipboard-win = "5.4"
windows = { version = "=0.62.2", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_System_WinRT"] }
windows-registry = "=0.6.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
libsqlite3-sys = { version = "0.37", features = ["bundled"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.30", features = ["term", "process", "poll", "fs"] }

[profile.release]
lto = "thin"
strip = true
